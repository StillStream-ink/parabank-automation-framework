[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
xfail_strict = true

addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=allure-results
    --junitxml=test-results/junit.xml
    --ignore=tests/api_test/scenarios/credit
    --ignore=tests/api_test/scenarios/parabank/old_01_customer_register.py
    --ignore=tests/api_test/scenarios/parabank/old_13_loan_apply_flow.py

markers =
    # ========== 层级 ==========
    smoke: 冒烟用例（CI 快速门禁）
    regression: 回归用例（每日跑）

    # ========== 类型 ==========
    api: API 接口测试
    ui: UI 网页测试

    # ========== 业务模块 ==========
    parabank: ParaBank 靶场系统
    login: 登录模块
    transfer: 转账模块
    loan: 贷款模块
    transaction: 交易查询模块
    deposit: 存款模块
    withdraw: 取款模块
    credit: 授信模块

    # ========== 优先级 ==========
    p0: 核心用例（阻塞发布）
    p1: 重要用例
    p2: 次要用例