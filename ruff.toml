# ruff 配置
# 文档: https://docs.astral.sh/ruff/

line-length = 100
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort（import 排序）
    "UP",   # pyupgrade（旧语法升级）
]
ignore = [
    "E501",  # 行宽超限（交给 formatter）
    "E402",  # module level import 不在顶部（conftest / 测试需要）
]

[lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"conftest.py" = ["E402"]
"scripts/**/*.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"