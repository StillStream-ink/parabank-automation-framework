name: ParaBank CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Install Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          sudo tar -zxf allure-2.30.0.tgz -C /opt/
          sudo ln -sf /opt/allure-2.30.0/bin/allure /usr/local/bin/allure
          allure --version

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build ParaBank
        run: |
          git clone --depth 1 https://github.com/parasoft/parabank.git /tmp/parabank
          cd /tmp/parabank
          mvn clean package -DskipTests -q

      - name: Start ParaBank
        run: |
          cd /tmp/parabank
          nohup mvn cargo:run > /tmp/parabank.log 2>&1 &
          echo "ParaBank 启动中..."

      - name: Wait for ParaBank
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -u john:demo \
              "http://localhost:8080/parabank/services/bank/customers/12212/accounts" || true)
            if [ "$code" = "200" ]; then
              echo "ParaBank 已就绪 (尝试 $i)"
              exit 0
            fi
            echo "等待中... ($i/30)"
            sleep 2
          done
          echo "ParaBank 启动超时"
          cat /tmp/parabank.log
          exit 1

      - name: Setup CI env
        run: cp .env.ci .env

      - name: Reset test data
        run: python scripts/reset_parabank.py --quiet

      # ==================== API 测试 ====================
      - name: Run API tests
        env:
          HEADLESS: "1"
        run: pytest tests/api_test -q --alluredir=allure-results

      # ==================== UI 测试 ====================
      - name: Run UI tests (headless)
        env:
          HEADLESS: "1"
          CI: "true"
        run: pytest tests/ui_test -q --alluredir=allure-results

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d allure-results ]; then
            allure generate allure-results --clean -o allure-report
          else
            mkdir -p allure-report
            echo "<h1>No test results</h1>" > allure-report/index.html
          fi

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/playwright/
          retention-days: 14
          if-no-files-found: ignore

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            allure-results/
            test-results/
          retention-days: 30

  deploy:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4